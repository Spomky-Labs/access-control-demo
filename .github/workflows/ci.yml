name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  # The two packages are required at 1.0.*@dev, so upstream moves under this application.
  # A weekly run is what turns that into a signal instead of a surprise.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.4', '8.5' ]

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, iconv
          coverage: none

      # Never from the lock file: the point of this application is to notice when the
      # library changes, and an up-to-date lock would hide exactly that.
      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Lint the container and the templates
        run: |
          php bin/console lint:container --env=test
          php bin/console lint:twig templates --env=test

      - name: Tests
        run: vendor/bin/phpunit
