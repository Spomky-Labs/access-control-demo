services:
  app:
    build: .
    ports:
      # Override with APP_PORT=8100 docker compose up -d when 8000 is taken.
      - "${APP_PORT:-8000}:8000"
    environment:
      # Left on dev so the profiler is reachable: its Access Control panel is one of the things
      # this application exists to show.
      APP_ENV: dev
      APP_DEBUG: 1

# There is deliberately no database service. The accounts and the documents live in memory, which
# is what makes the demo runnable with one command — authorization is what is being shown here,
# not persistence.
