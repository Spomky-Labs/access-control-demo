security:
    # In-memory users are enough to explore AccessControl. Passwords are stored in
    # plain text here on purpose: the point of this app is authorization, not hashing.
    password_hashers:
        Symfony\Component\Security\Core\User\InMemoryUser: 'plaintext'

    # Three demo accounts with increasing privileges. Log in with identical
    # username/password pairs: user/user, manager/manager, admin/admin.
    providers:
        users_in_memory:
            memory:
                users:
                    user:    { password: 'user',    roles: ['ROLE_USER'] }
                    manager: { password: 'manager', roles: ['ROLE_MANAGER'] }
                    admin:   { password: 'admin',   roles: ['ROLE_ADMIN'] }

    # Reused as-is by the AccessControl RoleVoter: holding ROLE_ADMIN implies
    # ROLE_MANAGER and ROLE_USER, holding ROLE_MANAGER implies ROLE_USER.
    role_hierarchy:
        ROLE_ADMIN: ['ROLE_MANAGER', 'ROLE_USER', 'ROLE_ALLOWED_TO_SWITCH']
        ROLE_MANAGER: ['ROLE_USER']

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|assets|build)/
            security: false
        main:
            lazy: true
            provider: users_in_memory
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_dashboard
                enable_csrf: true
            logout:
                path: app_logout
                target: app_home
            # Enables ?_switch_user=<username> impersonation (and ?_switch_user=_exit).
            # Requires ROLE_ALLOWED_TO_SWITCH, which admin reaches via the role hierarchy.
            switch_user: true

    # Authorization here is driven by #[AccessPolicy] attributes on the controllers,
    # so this list stays empty. It would work identically if enabled — with the
    # component installed, these rules go through the very same decision manager:
    access_control:
        # - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/dashboard, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
